# Requires GitHub Pages enabled with Source = "GitHub Actions"
# (repo Settings > Pages). Once: gh api repos/zyvorai/atlas/pages -X POST -f build_type=workflow
name: Deploy Docs Site
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/ux/**', 'docs/social/**', '.github/workflows/pages.yml']
  workflow_dispatch: {}
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version-file: website/.nvmrc, cache: npm, cache-dependency-path: website/package-lock.json}
      - run: npm --prefix website ci
      - run: npm --prefix website run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: {path: website/build}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    permissions: {pages: write, id-token: write}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
