#
# Publishes container images on a tagged release. Every push/PR already build-tests both
# Dockerfiles in ci.yml's `docker` job (push: false) — this workflow only fires on `v*` tags
# (or manual dispatch) and is the one place images actually get pushed, signed, and scanned.
name: Publish container images

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # anchore/sbom-action attaches the SBOM to the tag's GitHub Release
      packages: write
      id-token: write # keyless cosign signing
      security-events: write # Trivy SARIF upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image: ghcr.io/zyvorai/atlas
          - dockerfile: Dockerfile.ceph
            image: ghcr.io/zyvorai/atlas-ceph
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ steps.ver.outputs.version }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via this run's own OIDC token — no signing key/secret to manage.
      - name: Sign image (keyless)
        run: cosign sign --yes "${{ matrix.image }}@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: "${{ matrix.image }}:${{ steps.ver.outputs.version }}"
          format: cyclonedx-json
          output-file: "sbom-${{ matrix.image == 'ghcr.io/zyvorai/atlas' && 'atlas' || 'atlas-ceph' }}.cdx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image == 'ghcr.io/zyvorai/atlas' && 'atlas' || 'atlas-ceph' }}
          path: "sbom-*.cdx.json"
          retention-days: 90

      # Informational until a baseline is established, same posture as ci.yml's fmt check.
      # if: always() so an unrelated earlier-step failure (e.g. the SBOM upload) can't silently
      # skip this and leave the next step uploading a SARIF file that was never produced.
      - name: Scan image (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: "${{ matrix.image }}:${{ steps.ver.outputs.version }}"
          format: sarif
          output: trivy-results.sarif

      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: "trivy-${{ matrix.dockerfile }}"
