name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # Mirrors deny.toml's [licenses] allow-list, so a PR gets the same signal
          # cargo-deny already gives main for the Rust side.
          allow-licenses: >-
            MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause, ISC,
            Unicode-3.0, Zlib, Unlicense, BSL-1.0, AGPL-3.0-only, LicenseRef-Atlas-Commercial
          comment-summary-in-pr: always
