name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:00 UTC — catches newly-published CodeQL query packs even on quiet weeks.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # security-events:write is scoped to this job, not the workflow default, since it's the only
    # one of the two that needs it (there's only one job here, but Scorecard's Token-Permissions
    # check wants write grants declared at the job that uses them, not the workflow top level).
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Rust is a compiled language for CodeQL — it needs the same native deps as ci.yml's
      # build-test job (protoc for the gRPC crates, cmake+libcurl for the kafka-lag feature's
      # vendored librdkafka) before `autobuild` can compile the workspace.
      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - if: matrix.language == 'rust'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake libcurl4-openssl-dev

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
