#
# Creates a GitHub Release on a `v*` tag push: body pulled from CHANGELOG.md's matching
# section, atlasctl binaries for common platforms, and a UI dist bundle. Runs independently of
# docker-publish.yml (same trigger, no cross-workflow `needs:`) — both fire on the same tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # CHANGELOG.md follows Keep a Changelog: rename [Unreleased] -> [x.y.z] - date before
      # tagging. Extracts everything between this tag's "## [x.y.z]" heading and the next
      # "## [" heading as the release body.
      - name: Extract changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for [$version] - falling back to a placeholder body." >&2
            echo "_(No CHANGELOG.md [$version] section found.)_" > release-notes.md
          fi

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: release-notes.md
          generate_release_notes: true

  binaries:
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: contains(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake libcurl4-openssl-dev
      - if: contains(matrix.target, 'darwin')
        run: brew install protobuf cmake
      # `package: atlas-cli` (not just `bin: atlasctl`) matters here: without -p, cross/cargo
      # resolves features against the whole workspace's Cargo.lock, and atlas-gateway's default
      # reqwest (native-tls/openssl-sys) bleeds back in even though atlas-cli itself uses
      # rustls-tls-native-roots — reintroducing the exact cross-compile failure that dependency
      # override exists to avoid.
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: atlasctl
          package: atlas-cli
          target: ${{ matrix.target }}
          archive: atlasctl-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}

  ui-dist:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: crates/atlas-gateway/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: crates/atlas-gateway/ui/.nvmrc
          cache: npm
          cache-dependency-path: crates/atlas-gateway/ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: (cd dist && zip -r "../atlas-ui-dist-${GITHUB_REF_NAME}.zip" .)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: crates/atlas-gateway/ui/atlas-ui-dist-*.zip
