<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Atlas — Storage, as a product.">
  <defs>
    <linearGradient id="mark-bg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a15"/>
      <stop offset="1" stop-color="#cc420a"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="26%" r="62%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#a78bfa"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0b0b0f"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="860" y="46" width="300" height="240" fill="url(#dots)" opacity="0.20"/>

  <!-- bathymetric isobath contours -->
  <path d="M -20 470 C 280 424, 700 486, 1220 408" stroke="#60a5fa" stroke-width="1.3" fill="none" opacity="0.10"/>
  <path d="M -20 522 C 300 472, 620 566, 1220 486" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.14"/>
  <path d="M -20 578 C 320 616, 660 528, 1220 596" stroke="#60a5fa" stroke-width="1.3" fill="none" opacity="0.10"/>

  <!-- Zyvor mark -->
  <g transform="translate(80,64)">
    <rect width="64" height="64" rx="15" fill="url(#mark-bg)"/>
    <path d="M18.5,20.5 45.5,20.5 18.5,43.5 45.5,43.5" fill="none" stroke="#ffffff" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="78" y="300" font-family="'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="128" font-weight="700" fill="#f5f5f7">Atlas</text>

  <text x="82" y="356" font-family="'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="40" font-weight="500" fill="#0a84ff">Storage, as a product.</text>

  <text x="82" y="404" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="22" fill="#a1a1a6"><tspan fill="#0a84ff" font-weight="600">3</tspan> storage backends · <tspan fill="#0a84ff" font-weight="600">6</tspan> database engines · <tspan fill="#0a84ff" font-weight="600">80+</tspan> endpoints · <tspan fill="#0a84ff" font-weight="600">3</tspan> access surfaces</text>

  <text x="82" y="566" font-family="'SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#6e6e73">github.com/zyvorai/atlas · AGPL-3.0 + Commercial</text>
</svg>
