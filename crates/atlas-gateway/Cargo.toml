[package]
name = "atlas-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "atlas-gateway"
path = "src/main.rs"

[dependencies]
atlas-common = { workspace = true }
atlas-api-types = { workspace = true }
atlas-driver-core = { workspace = true }
atlas-driver-ceph = { workspace = true }
atlas-driver-nfs = { workspace = true }
atlas-driver-zfs = { workspace = true }
atlas-driver-k8s = { workspace = true }
atlas-driver-rgw = { workspace = true }
atlas-policy = { workspace = true }
atlas-inventory = { workspace = true }
atlas-discovery = { workspace = true }
atlas-monitor = { workspace = true }
atlas-jobs = { workspace = true }
atlas-databridge = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
openidconnect = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
sha2 = "0.10"
uuid = { workspace = true }
tonic = { version = "0.12", features = ["tls"] }
tonic-reflection = "0.12"
prost = "0.13"
async-stream = "0.3"
tokio-stream = "0.1"
rmcp = { version = "3.3", optional = true, default-features = false, features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = { version = "1", optional = true }

[features]
default = []
# Exposes Atlas's read-only inventory/advisor surface as an MCP server (see crates/atlas-gateway/src/mcp.rs).
# Default-off: mirrors the atlas-databridge optional-connector precedent — an extra authenticated
# protocol surface + dependency chain (rmcp-macros/schemars) that not every deployment wants compiled in.
mcp = ["dep:rmcp", "dep:schemars"]

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
reqwest = { workspace = true }
atlas-common = { workspace = true }
atlas-inventory = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
rmcp = { version = "3.3", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
# rmcp's `transport-streamable-http-client-reqwest` feature pulls its own reqwest major version
# (independent of this workspace's `reqwest = "0.12"`) — aliased so the MCP integration test can
# construct a client of the exact type `StreamableHttpClient` is implemented for.
reqwest-mcp-client = { package = "reqwest", version = "0.13", default-features = false }
