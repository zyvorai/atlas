// Atlas storage control-plane gRPC edge (PDF §5.3: typed internal contracts for products).
syntax = "proto3";

package atlas.v1;

service AtlasStorage {
  rpc Health(HealthRequest) returns (HealthReply);
  rpc ListClusters(Empty) returns (ListClustersReply);
  rpc ListPools(Empty) returns (ListPoolsReply);
  rpc ListVolumes(Empty) returns (ListVolumesReply);
  rpc GetVolume(GetVolumeRequest) returns (Volume);
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeReply);
  rpc DeleteVolume(DeleteVolumeRequest) returns (JobReply);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (JobReply);
  // Product-scoped: list only the volumes a product owns (via product_bindings).
  rpc ListVolumesByOwner(ListVolumesByOwnerRequest) returns (ListVolumesReply);
  rpc GetJob(GetJobRequest) returns (Job);
  // Server-streaming: emit the job on each state change until it reaches a terminal state.
  rpc WatchJob(GetJobRequest) returns (stream Job);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsReply);
}

message Empty {}

message HealthRequest {}
message HealthReply {
  string status = 1;
  string version = 2;
}

message Cluster {
  string id = 1;
  string name = 2;
  string health = 3;
  int64 raw_capacity_bytes = 4;
  int64 used_capacity_bytes = 5;
  int64 available_capacity_bytes = 6;
}
message ListClustersReply { repeated Cluster clusters = 1; }

message Pool {
  string id = 1;
  string name = 2;
  string kind = 3;
  int64 used_bytes = 4;
  int64 max_bytes = 5;
  string health = 6;
}
message ListPoolsReply { repeated Pool pools = 1; }

message Volume {
  string id = 1;
  string name = 2;
  string kind = 3;
  int64 size_bytes = 4;
  string state = 5;
  string pvc_name = 6;
  string storage_class = 7;
  string namespace = 8;
}
message ListVolumesReply { repeated Volume volumes = 1; }
message GetVolumeRequest { string id = 1; }

// Product ownership recorded in product_bindings so a product can later enumerate/guard its volumes.
message Owner {
  string product = 1;        // e.g. "veyron", "hyper2kvm"
  string resource_type = 2;  // e.g. "vm", "datastore"
  string resource_id = 3;    // the product-side resource id
  string role = 4;           // e.g. "owner", "consumer" (defaults to "owner")
}

message CreateVolumeRequest {
  string tenant_id = 1;
  string name = 2;
  int64 size_bytes = 3;
  string policy = 4;
  string namespace = 5;
  Owner owner = 6;
}
message CreateVolumeReply {
  string job_id = 1;
  string volume_id = 2;
  string state = 3;
}

// Generic job-accepted reply for async operations (delete/snapshot).
message JobReply {
  string job_id = 1;
  string state = 2;
}

message DeleteVolumeRequest { string id = 1; }

message CreateSnapshotRequest {
  string volume_id = 1;
  string name = 2;  // optional; defaults to snap-<suffix>
}

message ListVolumesByOwnerRequest {
  string product = 1;
  string resource_id = 2;  // optional; empty = all of the product's volumes
}

message GetJobRequest { string id = 1; }
message Job {
  string id = 1;
  string job_type = 2;
  string state = 3;
  int64 progress_percent = 4;
  string error = 5;
}

message Alert {
  string id = 1;
  string severity = 2;
  string title = 3;
  string description = 4;
  string state = 5;
  string resource_id = 6;
}
message ListAlertsRequest { string state = 1; }
message ListAlertsReply { repeated Alert alerts = 1; }
