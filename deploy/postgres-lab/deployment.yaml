# Throwaway Postgres for verifying atlas-inventory's Phase-1 HA scaffolding
# (connect_postgres/migrate_postgres, see docs/HA.md) against real infrastructure instead of just
# compiling behind the `postgres` feature flag. Single replica, ephemeral local-path storage — this
# is a connect+migrate smoke test, not a production HA reference deployment. The password is
# generated by up.sh (kubectl create secret generic, random), never committed here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-lab-data
  namespace: zyvor-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-lab
  namespace: zyvor-system
  labels: { app: postgres-lab }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres-lab }
  template:
    metadata:
      labels: { app: postgres-lab }
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: atlas }
            - { name: POSTGRES_USER, value: atlas }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-lab-auth, key: password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "atlas", "-d", "atlas"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-lab-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-lab
  namespace: zyvor-system
  labels: { app: postgres-lab }
spec:
  type: NodePort
  selector: { app: postgres-lab }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432, nodePort: 30432 }
