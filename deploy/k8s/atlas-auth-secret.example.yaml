# Example Secret for Atlas JWT auth. Do NOT commit real values.
# Prefer: ./scripts/deploy-remote.sh (or deploy-ceph-gateway-remote.sh) which creates
# `atlas-gateway-auth` with a random jwt-secret + bootstrap-admin-token if missing.
#
# After first login, mint lasting service-account JWTs with the bootstrap token, then:
#   kubectl -n <ns> patch secret atlas-gateway-auth --type=json \
#     -p='[{"op":"remove","path":"/data/bootstrap-admin-token"}]'
# and restart the gateway so ATLAS_BOOTSTRAP_ADMIN_TOKEN is gone.
apiVersion: v1
kind: Secret
metadata:
  name: atlas-gateway-auth
  namespace: zyvor-system   # or rook-ceph for the real-Ceph gateway
type: Opaque
stringData:
  jwt-secret: "REPLACE-WITH-openssl-rand-base64-48"
  # Optional one-shot admin bearer (raw string). Remove after minting real JWTs.
  bootstrap-admin-token: "REPLACE-WITH-openssl-rand-base64-32"
