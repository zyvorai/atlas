# Atlas gateway in ATLAS_CEPH_DRIVER_MODE=real. Runs in the rook-ceph namespace so it can mount
# the mon endpoints ConfigMap + admin keyring Secret; an initContainer renders /etc/ceph/{ceph.conf,keyring}
# so the credential never leaves the cluster. Live k8s driver also works via the mounted SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-gateway
  namespace: rook-ceph
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlas-gateway-readonly-cephns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlas-gateway-readonly           # ClusterRole defined in atlas-gateway.yaml
subjects:
  - kind: ServiceAccount
    name: atlas-gateway
    namespace: rook-ceph
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-gateway-ceph
  namespace: rook-ceph
  labels:
    app: atlas-gateway-ceph
spec:
  replicas: 1
  # Recreate: the SQLite PVC is ReadWriteOnce; old pod must release it before the new one mounts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: atlas-gateway-ceph
  template:
    metadata:
      labels:
        app: atlas-gateway-ceph
    spec:
      serviceAccountName: atlas-gateway
      securityContext:
        runAsUser: 0                       # lab: read the rendered keyring + run ceph/rbd freely
      initContainers:
        - name: render-ceph-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              # MON_ENDPOINTS looks like "a=10.43.1.2:6789" (comma-separated for multiple mons).
              mon_host=$(echo "$MON_ENDPOINTS" | tr ',' '\n' | sed 's/^[^=]*=//' | paste -sd, - 2>/dev/null || echo "${MON_ENDPOINTS#*=}")
              cat > /etc/ceph/ceph.conf <<CONF
              [global]
              mon_host = $mon_host
              [client.admin]
              keyring = /etc/ceph/keyring
              CONF
              cat > /etc/ceph/keyring <<KR
              [$CEPH_USER]
              key = $CEPH_KEY
              KR
              chmod 0644 /etc/ceph/ceph.conf /etc/ceph/keyring
              echo "rendered /etc/ceph for mon_host=$mon_host user=$CEPH_USER"
          env:
            - name: MON_ENDPOINTS
              valueFrom:
                configMapKeyRef:
                  name: rook-ceph-mon-endpoints
                  key: data
            - name: CEPH_USER
              valueFrom:
                secretKeyRef:
                  name: rook-ceph-mon
                  key: ceph-username
            - name: CEPH_KEY
              valueFrom:
                secretKeyRef:
                  name: rook-ceph-mon
                  key: ceph-secret
          volumeMounts:
            - name: ceph-config
              mountPath: /etc/ceph
      containers:
        - name: atlas-gateway
          image: localhost/atlas-gateway:ceph
          imagePullPolicy: Never
          env:
            - name: ATLAS_BIND_ADDR
              value: "0.0.0.0:5110"
            - name: ATLAS_DATABASE_URL
              value: "sqlite:///var/lib/atlas/atlas.db?mode=rwc"
            - name: ATLAS_CEPH_DRIVER_MODE
              value: "real"
            - name: ATLAS_AUTH_REQUIRED
              value: "0"
            - name: RUST_LOG
              value: "info,atlas_gateway=debug,atlas_driver_ceph=debug"
          ports:
            - containerPort: 5110
          readinessProbe:
            httpGet:
              path: /health
              port: 5110
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: ceph-config
              mountPath: /etc/ceph
              readOnly: true
            - name: data
              mountPath: /var/lib/atlas
      volumes:
        - name: ceph-config
          emptyDir: {}                     # ceph.conf/keyring regenerated each start; not durable state
        - name: data
          persistentVolumeClaim:
            claimName: atlas-gateway-ceph-data
---
# Durable SQLite storage on the platform's own Ceph class (dogfooding zyvor-rbd-prod).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-gateway-ceph-data
  namespace: rook-ceph
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: zyvor-rbd-prod
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-gateway-ceph
  namespace: rook-ceph
  labels:
    app: atlas-gateway-ceph
spec:
  type: NodePort
  selector:
    app: atlas-gateway-ceph
  ports:
    - name: http
      port: 5110
      targetPort: 5110
      nodePort: 30511
