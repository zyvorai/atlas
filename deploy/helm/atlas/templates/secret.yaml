# Only rendered when auth.createSecret is true (quickstart convenience — see values.yaml's
# comment on why createSecret:false + an externally-managed Secret is preferred beyond a lab).
{{- if .Values.auth.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atlas.fullname" . }}-auth
  namespace: {{ include "atlas.namespace" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.auth.jwtSecret | default (randAlphaNum 48) | quote }}
  admin-password: {{ .Values.auth.adminPassword | default (randAlphaNum 24) | quote }}
  {{- if .Values.auth.bootstrapAdminToken }}
  bootstrap-admin-token: {{ .Values.auth.bootstrapAdminToken | quote }}
  {{- end }}
{{- end }}
