# Minimal SIEM-stand-in receiver for verifying ATLAS_AUDIT_EXPORT_URL against something real (not
# just a test's in-process mock). See receiver.py for what it does. The ConfigMap holding
# receiver.py itself is created by up.sh (--from-file, so the script lives in one place, not
# duplicated into this YAML).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siem-lab-receiver
  namespace: zyvor-system
  labels: { app: siem-lab-receiver }
spec:
  replicas: 1
  selector:
    matchLabels: { app: siem-lab-receiver }
  template:
    metadata:
      labels: { app: siem-lab-receiver }
    spec:
      containers:
        - name: receiver
          image: docker.io/library/python:3.12-slim
          command: ["python3", "/app/receiver.py", "8080"]
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: script, mountPath: /app }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: script
          configMap: { name: siem-lab-receiver }
---
apiVersion: v1
kind: Service
metadata:
  name: siem-lab-receiver
  namespace: zyvor-system
  labels: { app: siem-lab-receiver }
spec:
  type: NodePort
  selector: { app: siem-lab-receiver }
  ports:
    - { name: http, port: 8080, targetPort: 8080, nodePort: 30557 }
