# All-in-one Jaeger (collector + query UI + in-memory storage) with native OTLP ingestion —
# receives the spans atlas-gateway exports once ATLAS_OTEL_EXPORTER_ENDPOINT is set to this
# service (see docs/TRACING.md; tracing itself is always compiled in, no Cargo feature needed).
# In-memory storage means traces don't survive a pod restart — fine for a lab/demo; a real
# deployment would point ATLAS_OTEL_EXPORTER_ENDPOINT at a production-grade OTel collector/backend
# (Tempo, Grafana Cloud, Honeycomb, ...) instead of this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-jaeger
  namespace: rook-ceph
  labels: { app: atlas-jaeger }
spec:
  replicas: 1
  selector:
    matchLabels: { app: atlas-jaeger }
  template:
    metadata:
      labels: { app: atlas-jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-jaeger
  namespace: rook-ceph
  labels: { app: atlas-jaeger }
spec:
  type: NodePort
  selector: { app: atlas-jaeger }
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30516
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30517
